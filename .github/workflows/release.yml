name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" package.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "SiYuan LaTeX formula auto-numbering plugin release $GITHUB_REF_NAME."
